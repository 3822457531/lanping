services:
  mysql:
    image: mysql:8.0
    container_name: lp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lanping
      MYSQL_USER: lanping
      MYSQL_PASSWORD: lanping
    ports:
      - "3306:3306"
    volumes:
      - lp_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lp-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      LP_DB_DSN: lanping:lanping@tcp(mysql:3306)/lanping?parseTime=true&loc=Local&charset=utf8mb4
      LP_JWT_SECRET: lanping-dev-secret-change-me
      LP_HTTP_ADDR: ":8080"
      LP_AUTO_MIGRATE: "true"
    ports:
      - "8080:8080"

volumes:
  lp_mysql_data:
